name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch — the older result is never wanted.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # No GITHUB_TOKEN on purpose. lib/github.ts resolves to null or a status
      # instead of throwing, so the build must succeed without credentials —
      # if it ever doesn't, that degradation has regressed and CI should say so.
      - name: Build
        run: npm run build
