name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch — the older result is never wanted.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # PageProps/LayoutProps are generated, not hand-written. They normally
      # appear during `next dev` or `next build`, so a clean checkout has no
      # route types and tsc fails with "Cannot find name 'PageProps'".
      - name: Generate route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      # Also runs without credentials. tests/github.test.ts deletes
      # GITHUB_TOKEN before each case precisely so the "no-token" path is tested
      # rather than accidentally skipped on a machine that happens to have one.
      - name: Test
        run: npm run test:coverage

      # No GITHUB_TOKEN on purpose. lib/github.ts resolves to null or a status
      # instead of throwing, so the build must succeed without credentials —
      # if it ever doesn't, that degradation has regressed and CI should say so.
      - name: Build
        run: npm run build
